version: '3.9'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - storage-service
      - fog-node

  storage-service:
    build: ./storage-service
    ports:
      - "4000:4000"
    depends_on:
      - mongodb

  fog-node:
    build: ./fog-node
    ports:
      - "8000:8000"

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
